apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-rollout
spec:
  replicas: 4
  strategy:
    canary:
      steps:
      - setWeight: 25
      - pause: {}
      - setWeight: 100
      analysis:
        templates:
        - templateName: canary-pod-name-analysis
        args:
        - name: rolloutName
          value: nginx-rollout
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
spec:
  rules:
  - host: nginx.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-pod-name-analysis
spec:
  metrics:
  - name: canaryPodNames
    interval: 30s
    successCondition: result != ""
    failureCondition: result == ""
    provider:
      kubernetes:
        namespace: kube-system
        query: >
          kubectl get pods -l app=nginx -n default -o=jsonpath='{.items[*].metadata.name}'
    valueFrom:
      path: $.data.result
